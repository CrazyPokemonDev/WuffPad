name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (.NET Framework 4.5, MSBuild)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "XML-Editor WuffPad.sln"

      # The runner does not ship the (long out of support) .NET Framework 4.5
      # targeting pack, so bring it along from NuGet and drop it where MSBuild
      # looks for targeting packs.
      - name: Install .NET Framework 4.5 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory refasm -ExcludeVersion
          $source = "refasm/Microsoft.NETFramework.ReferenceAssemblies.net45/build/.NETFramework/v4.5"
          Write-Host "Package contains:" (Get-ChildItem $source | ForEach-Object Name) -Separator ' '
          $target = "C:/Program Files (x86)/Reference Assemblies/Microsoft/Framework/.NETFramework/v4.5"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Force
          Write-Host "Installed" (Get-ChildItem $target).Count "reference assemblies into $target"

      - name: Build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $PWD 'build.log'
          $frameworkRoot = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework"
          msbuild "XML-Editor WuffPad.sln" /p:Configuration=Release "/p:Platform=Any CPU" "/p:TargetFrameworkRootPath=$frameworkRoot" /v:minimal /nologo 2>&1 |
            Tee-Object -FilePath $log | Out-Null
          $code = $LASTEXITCODE
          $problems = @(Get-Content $log | Where-Object { $_ -match ':\s(error|warning)\s' })
          $problems | Select-Object -First 40 | ForEach-Object { Write-Host "::error::$($_.Trim())" }
          if ($code -ne 0 -and $problems.Count -eq 0) {
            Write-Host "::error::MSBuild failed without diagnostics, tail:"
            Get-Content $log | Select-Object -Last 25 | ForEach-Object { Write-Host "::error::$($_.Trim())" }
          }
          if ($code -ne 0) { exit 1 }

      - name: Verify the offline helper files are embedded
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $exe = "XML-Editor WuffPad/bin/Release/XML-Editor WuffPad.exe"
          $asm = [Reflection.Assembly]::LoadFile((Resolve-Path $exe))
          $names = $asm.GetManifestResourceNames()
          $expected = @("language.xml", "descriptions.dict", "standardKeys.db", "emojis.txt")
          foreach ($file in $expected) {
            $resource = "XML_Editor_WuffPad.Builtin.$file"
            if ($names -notcontains $resource) { Write-Host "::error::Missing embedded resource: $resource"; exit 1 }
          }
          Write-Host "Embedded resources: $($names -join ', ')"

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WuffPad-bin
          path: XML-Editor WuffPad/bin/Release/
